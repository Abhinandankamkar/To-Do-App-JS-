<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="utility.css">
    <link rel="stylesheet" href="style.css">
    <title>Todo App</title>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
    </nav>
    <form >
        <h1>To-Do App</h1>
        <div class="container">

            <input id="inputTask" type="text" placeholder="Enter a new task">
            <button type="submit" id="btn">
                Add
            </button>
        </div>
        
        <ul id="taskList">

        </ul>

        <div class="info">
            <p>
                Total: <span class="total">0</span>
            </p>
            <p>
                Completed: <span class="completed">0</span>
            </p>
            <button class="clear">
                Clear All
            </button>
        </div>
    </form>
    <footer>
        THis is the footer
    </footer>




    <script src="script.js"></script>
</body>
</html>
